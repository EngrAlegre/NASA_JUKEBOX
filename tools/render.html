<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>render</title></head>
<body>
<!--
  Headless render harness. Loads the same engine the page uses and exposes
  window.renderRecord(id), which returns a base64 16-bit WAV of the whole side.
  Driven by tools/render_sides.js; never linked from the app.
-->
<script src="../src/analyze.js"></script>
<script src="../src/sonify.js"></script>
<script src="../src/records.js"></script>
<script src="../data/records.js"></script>
<script>
  const CATALOG = window.JUKEBOX_DATA.records;

  function settingsFor(id) {
    const defaults = {
      rootMidi: 50, scale: "dorian", tempoBase: 62, tempoRange: 40, palette: "glass",
      axis: [[30, 60, 140], [210, 70, 50]],
    };
    return Object.assign({}, defaults, window.RECORD_SETTINGS[id] || {});
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("missing " + src));
      img.src = "../data/" + src;
    });
  }

  async function bufferToBase64(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < buf.length; i += chunk) {
      bin += String.fromCharCode.apply(null, buf.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  window.renderRecord = async function renderRecord(id) {
    const rec = CATALOG.find((r) => r.id === id);
    if (!rec) throw new Error("no record " + id);
    const settings = settingsFor(id);

    const features = [];
    for (const f of rec.frames) {
      const img = await loadImage(f.src);
      features.push(Analyze.analyzeImage(img, { axis: settings.axis }));
    }

    const t0 = performance.now();
    const { bars } = Sonify.composeSide(features, settings);
    const composeMs = performance.now() - t0;

    const t1 = performance.now();
    const buffer = await Sonify.renderBars(bars, 44100, { tail: 3.2 });
    const renderMs = performance.now() - t1;

    const blob = Sonify.encodeWav(buffer);
    const b64 = await bufferToBase64(blob);

    let peak = 0, sum = 0, n = 0;
    for (let c = 0; c < buffer.numberOfChannels; c++) {
      const d = buffer.getChannelData(c);
      for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += v * v; n++; }
    }

    return {
      id,
      seconds: buffer.duration,
      composeMs: Math.round(composeMs),
      renderMs: Math.round(renderMs),
      peak: Number(peak.toFixed(4)),
      rms: Number(Math.sqrt(sum / Math.max(1, n)).toFixed(4)),
      notes: features.map((f, i) => bars[i].noteCount),
      bpm: bars.map((b) => b.bpm),
      sections: bars.map((b) => b.section),
      wav: b64,
    };
  };
</script>
</body>
</html>
