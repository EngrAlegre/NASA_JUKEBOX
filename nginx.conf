# nginx for the static jukebox. Mirrors the headers in netlify.toml so the
# deployment behaves the same however it is hosted.
#
# Note: a `location` that declares its own add_header drops every add_header
# inherited from the server block — including the CSP. Caching is therefore
# expressed with `expires`, which does not break inheritance.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json audio/mpeg;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov; connect-src 'self' https://gibs.earthdata.nasa.gov; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    # Frames, covers, audio and the catalog never change under the same name.
    location ~ ^/(data|audio)/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app itself must revalidate, so a new deploy is visible immediately.
    location ~* \.(html|js|css|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
